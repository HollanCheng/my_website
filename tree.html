    <title>家族世系树</title>
    <style>
        body {
            background-color: #f4f1ea;
            color: #333;
            font-family: "STZhongsong", "SimSun", sans-serif;
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }

        /* 密码锁界面 */
        #password-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 80vh;
        }
        .lock-box {
            background: #fffdf8;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            border: 1px solid #e0d8c8;
            border-radius: 8px;
            text-align: center;
        }
        .lock-box h2 { color: #5c432b; margin-top: 0; }
        input[type="password"] {
            padding: 10px; font-size: 16px; margin-bottom: 15px;
            border: 1px solid #ccc; border-radius: 4px; width: 200px;
            font-family: inherit; text-align: center;
        }
        button {
            padding: 10px 25px; font-size: 16px; background-color: #7a5c3d;
            color: white; border: none; border-radius: 4px; cursor: pointer;
            font-family: inherit; transition: background 0.3s;
        }
        button:hover { background-color: #5c432b; }
        #error-msg { color: #c0392b; font-size: 14px; margin-top: 10px; display: none; }

        /* 树状图容器 */
        #tree-container {
            display: none; /* 初始隐藏 */
            max-width: 1000px;
            margin: 0 auto;
            background: #fffdf8;
            padding: 30px 40px;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            border: 1px solid #e0d8c8;
        }
        h1 { text-align: center; color: #2c1e11; letter-spacing: 5px; border-bottom: 2px solid #8b6c4a; padding-bottom: 15px; margin-bottom: 30px; }
        
        /* 树节点样式 */
        ul.tree { list-style-type: none; padding-left: 20px; margin: 0; border-left: 1px dashed #ccc; }
        ul.tree.root { padding-left: 0; border-left: none; }
        li { margin: 8px 0; position: relative; }
        
        details {
            cursor: pointer;
            outline: none;
        }
        summary {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            color: #333;
            transition: background 0.2s;
            user-select: none;
        }
        summary:hover { background-color: #eee; }
        
        .person-info {
            font-weight: normal;
            font-size: 14px;
            color: #666;
            margin-left: 5px;
        }
        .gen-badge {
            background-color: #8b6c4a; color: white; 
            font-size: 12px; padding: 2px 6px; border-radius: 10px; margin-right: 5px;
        }
        .leaf-node { padding: 4px 8px; display: inline-block; font-weight: bold; }
        
        /* 回到顶部按钮 */
        .back-btn { display: block; text-align: center; margin-top: 40px; color: #7a5c3d; text-decoration: none; font-size: 16px; }
        .back-btn:hover { text-decoration: underline; }
    </style>

        let isRendered = false;

        // ================= 构建与渲染树 =================
        function renderTree() {
            if (isRendered) return; // 防止重复渲染
            
            // 1. 将扁平数据转为 Map 提高查找效率，并初始化 children 数组
            const map = {};
            rawData.forEach(item => {
                map[item.id] = { ...item, children: [] };
            });

            // 2. 构建父子关系
            const rootNodes = [];
            rawData.forEach(item => {
                const node = map[item.id];
                if (item.parentId && map[item.parentId]) {
                    map[item.parentId].children.push(node);
                } else {
                    rootNodes.push(node); // 没有父亲或父亲不在数据里的，作为根节点
                }
            });

            // 3. 递归渲染 HTML (使用 details 标签实现折叠)
            function buildHTML(node) {
                // 整理显示的附加信息：配偶、世次
                let extraInfo = "";
                if (node.spouse) extraInfo += ` | 配偶: ${node.spouse}`;
                
                const genBadge = `<span class="gen-badge">${node.gen}世</span>`;
                const title = `${genBadge} <strong>${node.name}</strong> <span class="person-info">${extraInfo}</span>`;

                if (node.children.length > 0) {
                    // 有子节点：使用 <details> 折叠
                    let html = `<li><details><summary>${title}</summary><ul class="tree">`;
                    // 按ID排序一下子节点，保证长幼有序
                    node.children.sort((a, b) => a.id - b.id).forEach(child => {
                        html += buildHTML(child);
                    });
                    html += `</ul></details></li>`;
                    return html;
                } else {
                    // 没有子节点：普通叶子节点
                    return `<li><span class="leaf-node">${title}</span></li>`;
                }
            }

            // 4. 生成最终 HTML 并插入页面
            let finalHTML = '<ul class="tree root">';
            // 按 ID 对根节点排序
            rootNodes.sort((a, b) => a.id - b.id).forEach(root => {
                finalHTML += buildHTML(root);
            });
            finalHTML += '</ul>';

            document.getElementById("tree-root").innerHTML = finalHTML;
            isRendered = true;
        }
    </script>
